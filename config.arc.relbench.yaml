# AutoResearchClaw -- RelBench v1 (rel-f1 / driver-top3) with local Qwen via llama.cpp.
# Based on config.arc.yaml; changes are marked with "# RB:".
project:
  name: "relbench-rel-f1-driver-top3"
  mode: "full-auto"

research:
  # RB: short on purpose -- it is also used to build literature-search queries.
  # The detailed protocol lives in rb_task/task_spec/*.md (injected via extra_prompts).
  topic: "Improving graph neural networks for relational deep learning on RelBench: architecture and feature-encoding modifications of the official GraphSAGE baseline on rel-f1 driver-top3 (binary classification)"
  domains:
    - "machine-learning"
  daily_paper_count: 5
  quality_threshold: 3.0

runtime:
  timezone: "Europe/Rome"
  max_parallel_tasks: 1
  approval_timeout_hours: 12
  retry_limit: 3

notifications:
  channel: "console"
  target: ""
  on_stage_start: true
  on_stage_fail: true
  on_gate_required: true

knowledge_base:
  backend: "markdown"
  root: "docs/kb"

openclaw_bridge:
  use_cron: false
  use_message: false
  use_memory: false
  use_sessions_spawn: false
  use_web_fetch: false
  use_browser: false

llm:
  provider: "openai-compatible"
  base_url: "http://127.0.0.1:8081/v1"
  wire_api: "chat_completions"
  api_key_env: "LLAMACPP_API_KEY"
  api_key: ""
  primary_model: "qwen3.6-35b"
  fallback_models: []

literature_search:
  sources:
    - "openalex"
    - "semantic_scholar"
    - "arxiv"
  max_results_per_query: 20
  inter_query_delay_sec: 1.5
  openalex_email: "researchclaw@users.noreply.github.com"
  openalex_api_key_env: "OPENALEX_API_KEY"
  openalex_api_key: ""
  s2_api_key_env: "S2_API_KEY"
  s2_api_key: ""

security:
  hitl_required_stages: [5, 9, 20]
  allow_publish_without_approval: false
  redact_sensitive_logs: true

experiment:
  mode: "sandbox"
  # RB: one full run = graph build + 2 conditions x 3 seeds. Pipeline timeout per run.
  # (main.py's own harness budget is RB_TIME_BUDGET_SEC=1500 s, i.e. stops at ~1200 s.)
  time_budget_sec: 1800
  # RB: in config mode every step is one cheap evaluation (~2 min), so more steps are affordable.
  max_iterations: 12
  # LONG RUN (e.g. 24 h): max_iterations: 150 and max_refine_duration_sec: 86400 (stage 13 stops at whichever comes first).
  # One evaluation (3 conditions x 10 seeds) takes ~2 min, so ~25-30 evaluations/hour. See docs/runs/RUN-003 before doing it.
  # RB: ogni tentativo = chiamata LLM con thinking + una run; il default (1.5 x time_budget) e' troppo corto.
  max_refine_duration_sec: 7200
  metric_key: "primary_metric"
  # RB: primary_metric is validation ROC-AUC -> higher is better.
  metric_direction: "maximize"
  sandbox:
    python_path: "/usr/bin/python3"
    gpu_required: false
    max_memory_mb: 4096
  opencode:
    enabled: false
    auto: false
  code_agent:
    # RB: stage 10 uses the seeded baseline (ARC_SEED_PROJECT_DIR); the agent is only a fallback.
    enabled: true
    architecture_planning: true
    sequential_generation: true
    hard_validation: true
    hard_validation_max_repairs: 2
    exec_fix_max_iterations: 2
    exec_fix_timeout_sec: 60
  benchmark_agent:
    # RB: the benchmark is fixed (RelBench); do not let the agent pick other datasets.
    enabled: false
    enable_hf_search: false
    enable_web_search: false
    tier_limit: 1
    min_benchmarks: 1
    min_baselines: 2
  figure_agent:
    enabled: true
    min_figures: 2
    max_figures: 4
    max_iterations: 2
    dpi: 150
    strict_mode: false
    nano_banana_enabled: false
  repair:
    enabled: true
    max_cycles: 2
    min_completion_rate: 0.5
    min_conditions: 2
    use_opencode: false

export:
  target_conference: "neurips_2025"
  authors: "Anonymous"
  bib_file: "references"

prompts:
  custom_file: ""
  # RB: task specification injected into the prompts of the relevant stages.
  # Relative paths: resolved from the working dir (/app in the container).
  # Needs the PromptManager patch (apply_relbench_patches.py) for sub-prompts.
  extra_prompts:
    hypothesis_gen: "rb_task/task_spec/short.md"
    experiment_design: "rb_task/task_spec/full.md"
    code_generation: "rb_task/task_spec/full.md"
    iterative_improve: "rb_task/task_spec/full.md"
    iterative_repair: "rb_task/task_spec/full.md"
    code_repair: "rb_task/task_spec/full.md"
    code_exec_fix: "rb_task/task_spec/full.md"
    result_analysis: "rb_task/task_spec/short.md"
    research_decision: "rb_task/task_spec/short.md"
    paper_outline: "rb_task/task_spec/short.md"
    paper_draft: "rb_task/task_spec/short.md"
    paper_revision: "rb_task/task_spec/short.md"
    peer_review: "rb_task/task_spec/short.md"

hitl:
  enabled: false
  mode: gate-only
  cost_budget_usd: 0.0
  notifications:
    on_pause: true
    on_quality_drop: true
    channels: ["terminal"]
  timeouts:
    default_human_timeout_sec: 86400
    auto_proceed_on_timeout: false
  collaboration:
    max_chat_turns: 20
    save_chat_history: true
  stage_policies: {}

metaclaw_bridge:
  enabled: false

web_search:
  enabled: true
  tavily_api_key_env: "TAVILY_API_KEY_UNSET"
  enable_scholar: true
  enable_pdf_extraction: true
  max_web_results: 10
